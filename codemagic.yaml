workflows:
  ios-ipa-workflow:
    name: INJAZ iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.alhawari.injaz"
      node: latest
      xcode: latest
      cocoapods: default
      # Optional: Configure App Store Connect API key or Code Signing in Codemagic UI/Environment
      # ios_signing:
      #   provisioning_profiles:
      #     - path/to/profile.mobileprovision
      #   certificates:
      #     - path/to/certificate.p12
    scripts:
      - name: Install Node dependencies and sync Capacitor iOS
        script: |
          npm install
          npx cap sync ios
      - name: Configure iOS Bundle Identifier and Display Name
        script: |
          PLIST_PATH="ios/App/App/Info.plist"
          if [ -f "$PLIST_PATH" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName INJAZ" "$PLIST_PATH" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string INJAZ" "$PLIST_PATH"
          fi
      - name: Set up code signing
        script: |
          xcode-project use-profiles --warn-only || true
      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcarchive
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - alhawari@example.com
        notify:
          success: true
          failure: true
